services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma-cursos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-plataforma_cursos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-plataforma_cursos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
